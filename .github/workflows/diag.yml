# Diagnosztika (kézi indítás): a NAV szinkron állapota – csak darabszámok és hibaüzenet, számlaadat nélkül.
name: Diagnosztika

on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'Csak olvasó (SELECT) lekérdezés az éles adatbázison'
        required: false
        default: ''
      nav_test:
        description: 'NAV szinkron próba'
        type: boolean
        default: false
      full_sync:
        description: 'Teljes szinkron (Billingo, NAV, adószámok, párosítás) – csak darabszámok'
        type: boolean
        default: false
      autopay:
        description: 'Billingo automatikus fizetve: próba (dry) vagy éles (run)'
        type: choice
        options: ['', 'dry', 'run']
        default: ''

permissions:
  contents: read

jobs:
  nav:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: NAV állapot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute cashflow --remote --json --command "SELECT key, value FROM settings WHERE key IN ('nav_last_sync','nav_last_date','nav_last_error','nav_last_result')"
          npx wrangler d1 execute cashflow --remote --json --command "SELECT status, count(*) AS n FROM nav_invoices GROUP BY status"
          npx wrangler secret list
      - name: Automatikus bankfeltöltés (aggreg8 / Mac-bot) állapota
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # csak időpont, darabszámok és az utolsó tétel dátuma – tételadat nélkül
          npx wrangler d1 execute cashflow --remote --json --command "SELECT key, value FROM settings WHERE key IN ('ingest_last', 'ingest_report', 'ingest_request')" | jq -c '.[0].results[]'
          npx wrangler d1 execute cashflow --remote --json --command "SELECT bank_name, provider, datetime(last_sync/1000,'unixepoch') AS last_sync, (SELECT MAX(date) FROM bank_tx t WHERE t.account_id = a.id) AS last_tx FROM bank_accounts a" | jq -c '.[0].results[]'
      - name: Lekérdezés
        if: ${{ inputs.sql != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SQL: ${{ inputs.sql }}
        run: |
          # csak SELECT engedett (nincs írás); több utasítás nem
          if ! printf '%s' "$SQL" | grep -qiE '^[[:space:]]*select[[:space:]]' || printf '%s' "$SQL" | grep -q ';'; then echo "Csak egyetlen SELECT engedett."; exit 1; fi
          npx wrangler d1 execute cashflow --remote --json --command "$SQL" | jq -c '.[0].results[]'
      - name: NAV szinkron próba
        if: ${{ inputs.nav_test }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          T=$(openssl rand -hex 32)
          echo "::add-mask::$T"
          printf '%s' "$T" | npx wrangler secret put DIAG_TOKEN --name cashflow-tervezo >/dev/null
          sleep 20
          curl -s -X POST https://cashflow-tervezo.pengemedia.workers.dev/api/diag/nav -H "X-Requested-With: cashflow" -H "X-Diag-Token: $T" | jq -c '{ok, invoices, unplanned, error, bank}' || true
          npx wrangler secret delete DIAG_TOKEN --name cashflow-tervezo >/dev/null <<< 'y' || true
      - name: Billingo automatikus fizetve
        if: ${{ inputs.autopay != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.autopay }}
        run: |
          T=$(openssl rand -hex 32)
          echo "::add-mask::$T"
          printf '%s' "$T" | npx wrangler secret put DIAG_TOKEN --name cashflow-tervezo >/dev/null
          sleep 20
          Q=""; [ "$MODE" = "run" ] && Q="?run=1"
          curl -s -m 120 -X POST "https://cashflow-tervezo.pengemedia.workers.dev/api/diag/autopay$Q" -H "X-Requested-With: cashflow" -H "X-Diag-Token: $T" | jq . || true
          npx wrangler secret delete DIAG_TOKEN --name cashflow-tervezo >/dev/null <<< 'y' || true
      - name: Teljes szinkron
        if: ${{ inputs.full_sync }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          T=$(openssl rand -hex 32)
          echo "::add-mask::$T"
          printf '%s' "$T" | npx wrangler secret put DIAG_TOKEN --name cashflow-tervezo >/dev/null
          sleep 20
          curl -s -m 300 -X POST "https://cashflow-tervezo.pengemedia.workers.dev/api/diag/sync" -H "X-Requested-With: cashflow" -H "X-Diag-Token: $T" | jq -c . || true
          npx wrangler secret delete DIAG_TOKEN --name cashflow-tervezo >/dev/null <<< 'y' || true
