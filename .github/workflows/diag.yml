# Diagnosztika (kézi indítás): a NAV szinkron állapota – csak darabszámok és hibaüzenet, számlaadat nélkül.
name: Diagnosztika

on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'Csak olvasó (SELECT) lekérdezés az éles adatbázison'
        required: false
        default: ''
      nav_test:
        description: 'NAV szinkron próba'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nav:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: NAV állapot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute cashflow --remote --json --command "SELECT key, value FROM settings WHERE key IN ('nav_last_sync','nav_last_date','nav_last_error','nav_last_result')"
          npx wrangler d1 execute cashflow --remote --json --command "SELECT status, count(*) AS n FROM nav_invoices GROUP BY status"
          npx wrangler secret list
      - name: Lekérdezés
        if: ${{ inputs.sql != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SQL: ${{ inputs.sql }}
        run: |
          # csak SELECT engedett (nincs írás); több utasítás nem
          if ! printf '%s' "$SQL" | grep -qiE '^[[:space:]]*select[[:space:]]' || printf '%s' "$SQL" | grep -q ';'; then echo "Csak egyetlen SELECT engedett."; exit 1; fi
          npx wrangler d1 execute cashflow --remote --json --command "$SQL" | jq -c '.[0].results[]'
      - name: NAV szinkron próba
        if: ${{ inputs.nav_test }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          T=$(openssl rand -hex 32)
          echo "::add-mask::$T"
          printf '%s' "$T" | npx wrangler secret put DIAG_TOKEN --name cashflow-tervezo >/dev/null
          sleep 20
          curl -s -X POST https://cashflow-tervezo.pengemedia.workers.dev/api/diag/nav -H "X-Requested-With: cashflow" -H "X-Diag-Token: $T" | jq -c '{ok, invoices, unplanned, error}' || true
          npx wrangler secret delete DIAG_TOKEN --name cashflow-tervezo >/dev/null <<< 'y' || true
