# Automatikus ellenőrzés és telepítés Cloudflare-re.
# - Minden push / pull request: típusellenőrzés, tesztek, build.
# - Push a main vagy a fejlesztési (claude/dreamy-johnson-9ejay9) ágra: adatbázis migráció + telepítés (élesítés).
# Szükséges GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (a D1_DATABASE_ID már a wrangler.toml-ban van)
name: Ellenőrzés és telepítés

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a verziószámhoz (v1.<commitok száma>)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  deploy:
    needs: check
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/dreamy-johnson-9ejay9') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a verziószámhoz (v1.<commitok száma>)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: D1 adatbázis azonosító beírása
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.toml
          fi
      - name: Adatbázis migráció
        # A kód csak sikeres migráció után települhet (a verzióvédelem sémát igényel).
        run: |
          set +e
          npx wrangler d1 migrations apply cashflow --remote > /tmp/cashflow-migration.log 2>&1
          result=$?
          cat /tmp/cashflow-migration.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYERROR'
          import pathlib, re
          text = pathlib.Path('/tmp/cashflow-migration.log').read_text()
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=D1 migration failed::{text}')
          PYERROR
          fi
          exit "$result"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Telepítés
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Éles felület és API ellenőrzése
        run: |
          python3 - <<'PYSMOKE'
          import hashlib, json, os, pathlib, time, urllib.request
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.paths = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('type') == 'module' and attrs.get('src'):
                      self.paths.append(attrs['src'])
          base = 'https://cashflow-tervezo.pengemedia.workers.dev'
          def get(path):
              req = urllib.request.Request(base + path, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()
          local = Scripts(); local.feed(pathlib.Path('dist/index.html').read_text())
          assert local.paths, 'No compiled application script in dist/index.html'
          for attempt in range(6):
              try:
                  remote = Scripts(); remote.feed(get('/?deployment=' + os.environ['GITHUB_SHA']).decode())
                  assert remote.paths == local.paths, 'The live HTML still serves another application build'
                  for path in local.paths:
                      assert path.startswith('/assets/'), 'Unexpected script location'
                      assert hashlib.sha256(get(path)).digest() == hashlib.sha256(pathlib.Path('dist' + path).read_bytes()).digest(), 'Live script differs from deployed artifact'
                  status = json.loads(get('/api/auth/status'))
                  assert isinstance(status.get('hasUsers'), bool) and 'me' in status, 'Unexpected authentication API response'
                  print('Production HTML, compiled application assets and authentication API verified.')
                  break
              except Exception:
                  if attempt == 5: raise
                  time.sleep(5)
          PYSMOKE
