# Automatikus ellenőrzés és telepítés a saját tárhelyre: https://pmdev.hu/Cashflow/
# - Minden push / pull request: típusellenőrzés, tesztek, build.
# - Push a main vagy a fejlesztési (claude/dreamy-johnson-9ejay9) ágra: telepítés SSH-n a pmdev.hu-ra (pengemed:~/cashflow).
# Szükséges GitHub Secret (Settings → Secrets and variables → Actions):
#   PMDEV_SSH_KEY – a pengemed fiókba engedélyezett privát SSH-kulcs
# Adatbázis: a szerver MySQL-t használ; új migrations/ fájl esetén a telepítés megáll, a sémát kézzel kell frissíteni.
# A szerveren a repóval azonos szerkezet: dist/client, dist/server/worker.mjs, src/server/runtime/*.mjs,
# deploy/passenger/entry.cjs. Előfeltétel (egyszeri, kézi): a Passenger PassengerStartupFile-ja
# deploy/passenger/entry.cjs, a cron a src/server/runtime/cron.mjs-t futtatja – amíg nem, a telepítés megáll.
name: Ellenőrzés és telepítés

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a verziószámhoz (v1.<commitok száma>)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:security
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  deploy:
    needs: check
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/dreamy-johnson-9ejay9') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_TARGET: pengemed@pmdev.hu
      APP_DIR: cashflow
      SITE: https://pmdev.hu/Cashflow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a verziószámhoz (v1.<commitok száma>) és a migráció-ellenőrzéshez
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:security
      - name: Build (felület /Cashflow/ alá + szerveroldali csomag)
        run: |
          npx vite build --base /Cashflow/
          npm run build:server
      - name: SSH beállítása
        env:
          PMDEV_SSH_KEY: ${{ secrets.PMDEV_SSH_KEY }}
        run: |
          test -n "$PMDEV_SSH_KEY" || { echo '::error title=Hiányzó titok::PMDEV_SSH_KEY nincs beállítva'; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PMDEV_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo 'pmdev.hu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMewO64g5AcAv0lPIwWAu+dSSrnA8mtdMHhdMYr+pl0M' > ~/.ssh/known_hosts
          printf 'Host pmdev.hu\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 30\n' > ~/.ssh/config
      - name: Migráció-ellenőrzés (MySQL-t nem módosítunk automatikusan)
        run: |
          PREV=$(ssh "$SSH_TARGET" "cat $APP_DIR/.deployed-sha 2>/dev/null" || true)
          echo "Előző élesített commit: ${PREV:-ismeretlen}"
          if [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$PREV" HEAD -- migrations)
            if [ -n "$CHANGED" ]; then
              echo "::error title=Új adatbázis-migráció::A MySQL sémát kézzel kell frissíteni a telepítés előtt: $CHANGED"
              exit 1
            fi
          else
            echo '::warning::Az előző élesített commit nem azonosítható, a migráció-ellenőrzés kimaradt.'
          fi
      - name: Szerver-előfeltételek (Passenger és cron az új szerkezetre mutat)
        run: |
          ssh "$SSH_TARGET" 'bash -s' <<'CHECK'
          set -u
          ok=1
          grep -q '^PassengerStartupFile deploy/passenger/entry.cjs' ~/public_html/pmdev.hu/Cashflow/.htaccess \
            || { echo '::error title=Passenger::A PassengerStartupFile nem deploy/passenger/entry.cjs – kézi átállítás kell.'; ok=0; }
          crontab -l 2>/dev/null | grep -q 'src/server/runtime/cron.mjs' \
            || { echo '::error title=Cron::A cron nem a src/server/runtime/cron.mjs-t futtatja – kézi átállítás kell.'; ok=0; }
          [ "$ok" = 1 ]
          CHECK
      - name: Telepítés a pmdev.hu-ra
        run: |
          tar -czf "$RUNNER_TEMP/release.tgz" dist/client dist/server/worker.mjs src/server/runtime/*.mjs deploy/passenger/entry.cjs
          ssh "$SSH_TARGET" "cat > $APP_DIR/.release.tgz" < "$RUNNER_TEMP/release.tgz"
          ssh "$SSH_TARGET" "APP_DIR=$APP_DIR SHA=$GITHUB_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/"$APP_DIR"
          NEW=.deploy-new
          rm -rf "$NEW" && mkdir "$NEW"
          tar -xzf .release.tgz -C "$NEW" && rm -f .release.tgz
          TS=$(date +%Y%m%d-%H%M%S)
          BK=.backup/$TS
          mkdir -p "$BK"
          # A cPanel domain webrootja eltérhet a public_html gyökértől.
          WEB_CONFIG=""
          for PUBLIC_ROOT in "$HOME/public_html" "$HOME/pmdev.hu" "$HOME/domains/pmdev.hu/public_html"; do
            [ -d "$PUBLIC_ROOT" ] || continue
            find -L "$PUBLIC_ROOT" -maxdepth 6 -type f -name .htaccess -print0 > "$NEW/web-configs.list" 2>/dev/null || true
            while IFS= read -r -d '' CONFIG; do
              if awk -v expected="$HOME/$APP_DIR" '$1 == "PassengerAppRoot" {gsub(/"/, "", $2); if ($2 == expected) found=1} END {exit !found}' "$CONFIG"; then
                CANONICAL=$(readlink -f "$CONFIG")
                if [ -n "$WEB_CONFIG" ] && [ "$WEB_CONFIG" != "$CANONICAL" ]; then echo "Több Passenger konfiguráció illeszkedik; kézi ellenőrzés kell."; exit 1; fi
                WEB_CONFIG="$CANONICAL"
              fi
            done < "$NEW/web-configs.list"
          done
          [ -n "$WEB_CONFIG" ] || { echo "A Cashflow Passenger-konfiguráció nem található a publikus webgyökerekben."; exit 1; }
          # Az SSH shell nem aktiválja a cPanel Node-környezetet.
          NODE_BIN=""
          CONFIG_NODE=$(awk '$1 == "PassengerNodejs" {gsub(/"/, "", $2); print $2; exit}' "$WEB_CONFIG" 2>/dev/null || true)
          for CANDIDATE in "$CONFIG_NODE" "$(command -v node || true)" "$HOME/nodevenv/$APP_DIR"/*/bin/node /opt/alt/alt-nodejs*/root/usr/bin/node; do
            [ -x "$CANDIDATE" ] || continue
            if "$CANDIDATE" -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 18 ? 0 : 1)'; then NODE_BIN="$CANDIDATE"; break; fi
          done
          [ -n "$NODE_BIN" ] || { echo "Nem találom a tárhely meglévő Node futtatókörnyezetét."; exit 1; }
          # A tárhely útvonalát még az alkalmazás cseréje előtt ellenőrizzük.
          "$NODE_BIN" "$NEW/src/server/runtime/enforce-https.mjs" "$WEB_CONFIG" "$BK/public-htaccess"
          # a telepítés által kezelt mappák: mentés, majd csere
          for d in dist src deploy; do
            if [ -e "$d" ]; then mv "$d" "$BK/$d"; fi
            mv "$NEW/$d" "$d"
          done
          [ -f .deployed-sha ] && cp .deployed-sha "$BK/" || true
          # a korábbi verzió részfájljai is maradjanak (a nyitva hagyott lapok ezeket kérhetik)
          cp -n "$BK/dist/client/assets/"* dist/client/assets/ 2>/dev/null || true
          rm -rf "$NEW"
          # Passenger útvonal: a HTTPS-átirányítás a publikus webrootban is kötelező.
          # Előbb száraz próba, majd mentés és célzott, visszavonható beillesztés.
          "$NODE_BIN" src/server/runtime/enforce-https.mjs "$WEB_CONFIG" "$BK/public-htaccess" --apply
          echo "$SHA" > .deployed-sha
          mkdir -p tmp && touch tmp/restart.txt
          # az utolsó 5 mentés marad meg
          ls -1d .backup/*/ | sort | head -n -5 | xargs -r rm -rf
          echo "Telepítve: $SHA (mentés: $BK)"
          REMOTE
      - name: Éles felület és API ellenőrzése
        run: |
          python3 - <<'PYSMOKE'
          import hashlib, json, os, pathlib, time, urllib.request, urllib.error
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.paths = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('type') == 'module' and attrs.get('src'):
                      self.paths.append(attrs['src'])
          site = os.environ['SITE']
          origin = site.split('/Cashflow')[0]
          def get(url):
              req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'cashflow-deploy-smoke/1.0 (+github-actions)'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()
          local = Scripts(); local.feed(pathlib.Path('dist/client/index.html').read_text())
          assert local.paths, 'No compiled application script in dist/client/index.html'
          for attempt in range(8):
              try:
                  remote = Scripts(); remote.feed(get(site + '/?deployment=' + os.environ['GITHUB_SHA']).decode())
                  assert remote.paths == local.paths, 'The live HTML still serves another application build'
                  for path in local.paths:
                      assert path.startswith('/Cashflow/assets/'), 'Unexpected script location'
                      assert hashlib.sha256(get(origin + path)).digest() == hashlib.sha256(pathlib.Path('dist/client' + path[len('/Cashflow'):]).read_bytes()).digest(), 'Live script differs from deployed artifact'
                  status = json.loads(get(site + '/api/auth/status'))
                  assert isinstance(status.get('hasUsers'), bool) and 'me' in status, 'Unexpected authentication API response'
                  assert status.get('twofaMode') in ('off', 'admin', 'all'), 'twofaMode missing from auth status'
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, *args): return None
                  try:
                      response = urllib.request.build_opener(NoRedirect).open(site.replace('https://', 'http://') + '/', timeout=30)
                  except urllib.error.HTTPError as error:
                      response = error
                  assert response.code in (301, 302, 307, 308) and response.headers.get('Location', '').startswith(site), 'HTTP must redirect to the HTTPS application'
                  print('pmdev.hu/Cashflow: HTML, application assets and authentication API verified.')
                  break
              except Exception as error:
                  if attempt == 7:
                      message = str(error).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error title=Production smoke check failed::{message}')
                      raise
                  time.sleep(5)
          PYSMOKE
