# Bankszinkron kérése (kézi indítás, pl. Claude-tól): a Mac fél percen belül lefuttatja az aggreg8 frissítést és feltöltést.
name: Bankszinkron kérése

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bank-sync

jobs:
  request:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kérés rögzítése
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          AT=$(( $(date +%s) * 1000 ))
          npx wrangler d1 execute cashflow --remote --command "INSERT INTO settings (key, value) VALUES ('ingest_request', '{\"at\":$AT,\"by\":\"claude\"}') ON CONFLICT(key) DO UPDATE SET value = excluded.value"
          echo "Kérve: $AT – a Mac fél percen belül indítja. Állapot: Diagnosztika workflow."
