# Cloudflare Worker konfiguráció – Cashflow tervező
name = "cashflow-tervezo"
main = "worker/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# A buildelt webes felület (Vite → dist/). Az /api/* kéréseket a Worker kezeli,
# minden mást a statikus fájlok (SPA fallback-kel).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 adatbázis (Cloudflare: pengemedia fiók)
[[d1_databases]]
binding = "DB"
database_name = "cashflow"
database_id = "b39b7832-12e5-4905-b4a8-896b0985eaa2"
migrations_dir = "migrations"

# Automatikus szinkron (Billingo + bankok + automatikus párosítások) naponta 5, 9, 13, 17, 21 órakor
# budapesti idő szerint. A cron UTC-ben fut: mindkét (nyári/téli) eltolásra beállítva,
# a Worker csak a megfelelő budapesti órában dolgozik (lásd worker/index.ts).
[triggers]
crons = ["2 3,4,7,8,11,12,15,16,19,20 * * *"]

[observability]
enabled = true

# Titkok (NEM a repóban!):  wrangler secret put <NÉV>
#   SETUP_TOKEN        – az első admin felhasználó létrehozásához
#   BILLINGO_API_KEY   – Billingo v3 API kulcs
#   EB_APP_ID          – Enable Banking alkalmazás azonosító (PSD2 bankkapcsolat)
#   EB_PRIVATE_KEY     – Enable Banking alkalmazás privát kulcs (PEM, PKCS#8)
#   NAV_LOGIN, NAV_PASSWORD, NAV_SIGN_KEY, NAV_TAX_NUMBER – NAV Online Számla technikai felhasználó (bejövő számlák)
